# Forecast pipeline settings. Model identifiers were checked against the live
# Open-Meteo API on 4 Nov 2026 (see docs/SOURCES.md); missing models or
# variables are tolerated at run time.

models:
  # Deterministic models used for the consensus at every lead time they cover.
  global: [gfs_seamless, ecmwf_ifs025, gem_seamless, icon_seamless]
  # Short-range models that join the consensus for the first 48 h.
  short_range:
    US: [ncep_hrrr_conus, ncep_nbm_conus]
    CA: [gem_hrdps_continental]
  # NBM has no pressure-level data.
  upper_air_exclude: [ncep_nbm_conus]

# Ensemble systems (member counts: GEFS 31, ECMWF ENS 51, GEPS 21).
ensembles: [gfs_seamless, ecmwf_ifs025, gem_global]

short_range_hours: 48
consensus_min_models: 3
blend_periods: 4
periods: 20
hourly_hours: 240
day_start_hour: 6
night_start_hour: 18
min_period_hours: 6
ensemble_min_members: 10
ensemble_max_age_h: 13

# Open-Meteo derives snowfall from snow water with a fixed ratio:
# 0.7 cm of snow per mm of water (7:1).
snowfall_cm_per_mm: 0.7
# Snow level is this far below the freezing level.
snow_level_offset_m: 305

# Snow-to-liquid ratio from the median temperature during snowing hours.
# Bands are checked top-down; min_c is inclusive (°F 31/26/19 converted).
slr_bands:
  - {min_c: -0.556, ratio: 8, label: "Heavy & wet"}
  - {min_c: -3.333, ratio: 11, label: "Average"}
  - {min_c: -7.222, ratio: 14, label: "Light"}
  - {min_c: null, ratio: 17, label: "Dry & fluffy"}
# Headline depth method: "slr" (snow water × the ratio above, from the temperature
# while it snows) or "raw" (Open-Meteo's 7:1 model snowfall). Every snow total the
# app shows (bars, totals, ranges, model bars, flags, ratings, alerts) follows it;
# the snapshot keeps both as snow_cm_raw / snow_cm_slr.
depth_method: slr

schedule:
  runs_utc: ["03:30", "09:30", "15:30", "21:30"]
  ensemble_runs_utc: ["09:30", "21:30"]
  backup_utc: "10:00"
  vacuum_weekday: sun
  # Extra avalanche-forecast checks (centers publish 6–10 am Mountain time).
  # Every forecast run also refreshes them.
  avalanche_utc: ["13:45", "15:45", "17:45"]

# Ski-day rating for resorts (Powder / Great / Good / Fair / Poor).
# New snow is the night before plus the day, at mid; the rest is during lift hours.
skiday:
  lift_start_hour: 9
  lift_end_hour: 16
  powder_cm: 15         # 6 in
  great_cm: 8           # 3 in
  good_cm: 3            # 1 in
  clear_cloud_low_pct: 50  # a dry day with less low cloud than this is Good
  dry_water_mm: 0.5
  rain_fair_mm: 1       # rain at mid caps the day at Fair…
  rain_poor_mm: 5       # …or Poor
  gust_hold_kmh: 70     # 45 mph at the summit: lift holds likely (−1)
  gust_closed_kmh: 90   # 55 mph (−2)
  flat_light_vis_m: 1000
  flat_light_cloud_low_pct: 80
  very_cold_c: -18      # 0 °F high

# Backcountry layer. The app never rates whether a tour is safe.
backcountry:
  refreeze_good_c: -3        # Good: a low at or below this with a mostly clear night
  refreeze_partial_c: 0      # Partial: a low at or below freezing
  refreeze_clear_cloud_pct: 30
  refreeze_clear_frac: 0.5
  rose_min_snow_cm: 2        # less new snow than this: "little new snow to move"
  rose_min_wind_kmh: 15
  # The day-by-day "avalanche weather" outlook: how hard each day's weather pushes on
  # the snowpack. Rules of thumb, not a danger rating. Each factor has three steps:
  # the values where it becomes "some", "strong" and "very strong". The day's weather
  # stress is its strongest factor, one step more when two are strong together.
  outlook_days: 7
  outlook_snow_cm: [10, 25, 40]    # new snow in the day at the summit (4, 10, 16 in)
  outlook_storm_cm: [30, 50, 80]   # or over 72 h (12, 20, 31 in), whichever grades higher
  outlook_wind_kmh: [25, 40, 60]   # ridge wind, the day's strongest 6 h (16, 25, 37 mph)
  outlook_wind_thin_cm: 15         # with less snow than this in 72 h, drifting stays "some"
  outlook_rain_mm: [1, 6, 20]      # rain onto snow at mid (0.04, 0.25, 0.8 in)
  outlook_rise_c: [5, 8, 12]       # warming within 24 h at mid (9, 14, 22 °F)
  outlook_thaw_h: [3, 8]           # hours above freezing at the summit: some, strong
                                   # (a good refreeze the night before holds it at "some";
                                   # no refreeze makes it one step more)

# The Map page's radar and forecast pictures (see docs/MAP-PLAN.md).
map:
  # The box they cover: [south, west, north, east] in degrees, western North America.
  # Widened only to take in a location outside it.
  region: [31, -134, 57, -102]
  width: 1700            # pixels; about 1.5 km a pixel over this box
  radar_minutes: 6       # radar and nowcast (a new scan every 6 minutes)
  forecast_minutes: 30   # forecast frames (hourly to 48 h, then 3- and 6-hourly to 10 days)
  totals_minutes: 60     # snow totals (12 h to 10 days)
  layers_minutes: 30     # snow level, wind, snow on the ground, observed snowfall, clouds
  # NOAA NBM runs (UTC) for the US beyond 48 h and US snow totals. Only 00/06/12/18
  # reach 10 days; each new run costs ~60-80 MB of downloads.
  nbm_cycles: [0, 12]
  # Recent satellite: Sentinel-2 views of the 24 x 24 km round each location.
  sat_hours: 6           # look for new passes this often
  sat_days: 30           # the stitched newest-clear view uses passes this recent
  sat_scene_days: 60     # whole scenes are looked for this far back
  sat_min_clear: 0.85    # a whole scene sees at least this share of the area clearly
  sat_max_nodata: 0.03   # and misses at most this much of it (off its swath)
  sat_keep: 3            # whole scenes kept per location (the map steps through them)
  # Snow stations (SNOTEL and BC snow pillows) and Avalanche Canada field reports.
  stations_minutes: 60   # depth and 24-hour change at every station in the box
  obs_minutes: 60        # Mountain Information Network reports
  obs_days: 14           # how far back reports go (at most 30)

# The map's avalanche terrain layers (see docs/MAP-PLAN.md, B7). Treeline bands are in
# config/treeline.yaml.
terrain:
  # "Avalanche problems": terrain matching today's listed problems from this slope up
  # (25, 30 or 35; the map lets the viewer change it).
  problem_slope_deg: 30
  # "Concern index": the app's own experimental estimate, never a forecast. Who sees it
  # is the HAZARD_INDEX setting (off, owner or public; owner by default).
  #   score = (published danger for the band + wind + sun) × slope × match
  concern_slope: [[25, 0.5], [30, 1.0], [46, 0.7], [56, 0.3]]  # [from degrees, factor]
  concern_match_listed: 1.0    # the spot's aspect and band are in a listed problem
  concern_match_other: 0.6     # they aren't
  concern_match_none: 0.8      # the bulletin lists no problems
  concern_wind_loaded: 0.5     # wind-loaded (with a wind or storm slab problem, or lots of new snow)
  concern_wind_scoured: -0.25  # scoured
  concern_wind_effect: 0.2     # wind effect beyond this counts as loaded or scoured
  concern_wind_snow_cm: 20     # new snow in the last 48 h that brings in loading on its own
  concern_sun: 0.5             # E to W slopes in the sun, on a day with a wet-snow problem or warming
  concern_sun_hours: 3         # hours of direct sun that counts
  concern_classes: [1.5, 2.5, 3.5]  # elevated, high, very high
