# Six starting locations, used to seed a new database with `snowwatch init`. After that the list lives in the
# database and is managed in the app (Manage locations) or with
# `snowwatch locations import|export`.
#
# NWS office/radar come from api.weather.gov/points; avalanche zones from a
# point-in-polygon lookup on the avalanche.org map layer (4 Nov 2026).
# Elevations are metres. Canadian avalanche zones are looked up by point at
# run time because Avalanche Canada's area ids change through the season.

- id: crystal
  name: Crystal Mountain
  kind: resort
  region: WA Cascades
  country: US
  tz: America/Los_Angeles
  bands:
    - {band: base, label: Base, lat: 46.935, lon: -121.475, elev_m: 1341}
    - {band: mid, label: Mid-mountain, lat: 46.935, lon: -121.475, elev_m: 1800}
    - {band: summit, label: Summit, lat: 46.935, lon: -121.475, elev_m: 2095}
  snotel: "642:WA:SNTL"
  nws_office: SEW
  radar_station: KATX
  avy: {provider: nac, center_id: NWAC, zone_id: "3023"}
  links:
    Radar (Seattle): https://radar.weather.gov/station/katx/standard
    NWS forecast: https://forecast.weather.gov/MapClick.php?lat=46.935&lon=-121.475
    Avalanche (NWAC): https://nwac.us/forecasts/avalanche/west-slopes-south
    Mountain passes (WSDOT): https://wsdot.com/travel/real-time/mountainpasses/

