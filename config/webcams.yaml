# Webcams for the home installation's locations, gathered from each resort's webcam
# page, the National Park Service, WSDOT and ODOT (18–19 Nov 2026).
#
# The worker applies this file by itself: merge a change and, once the server has
# updated, each location whose entry changed gets these webcams (replacing its own) and
# shows them a few minutes later. Entries that didn't change leave the location alone,
# so webcams edited on the Manage page stay until that location's entry here changes.
# A location listed before it exists gets its webcams once it is added. To force the
# whole file now: docker compose run --rm worker snowwatch locations webcams
#
# Each webcam: name, url (the page "Open site" opens), and optionally image_url (a
# picture the camera updates) and video_url (a live player: YouTube, CamStreamer,
# Brownrice, Roundshot or Ozolio). See docs/DEPLOYMENT.md → Webcams.
#
# No public cameras found: Maple Pass (WSDOT has none on SR 20 near Rainy Pass this
# season) and Mt. Baker (the ski area publishes none; no WSDOT cameras on SR 542).
# Mt. Gasworks is left as it is.

