# Snow Watch: the api (web app and API) and the worker (forecast runs, backups), plus
# an optional self-hosted Open-Meteo server. See docs/DEPLOYMENT.md.
#   GIT_COMMIT=$(git rev-parse --short HEAD) docker compose up -d --build
#   docker compose run --rm worker snowwatch init     # first time only
name: snowwatch

x-hardening: &hardening
  read_only: true # the app only writes to ./data (and /tmp)
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

services:
  api:
    <<: *hardening
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
    image: snowwatch:local
    env_file:
      - path: .env
        required: false
    environment:
      ENV: prod # production cookies, headers and no API docs, whatever .env says
    volumes:
      - ./data:/data
      # The Open-Meteo server's volume, read-only: what the ensemble downloader wrote
      # (milestone 1b). Empty, and unused, without the openmeteo profiles.
      - openmeteo-data:/openmeteo:ro
    ports:
      - "8090:8000" # point your reverse proxy or tunnel at http://<host>:8090
    mem_limit: 768m
    restart: unless-stopped

  worker:
    <<: *hardening
    # Same image, built once by the api service.
    image: snowwatch:local
    pull_policy: never
    command: ["snowwatch", "worker"]
    # A tiny init as PID 1 reaps the processes headless Chromium leaves when it exits
    # (it reads NWAC's observations page); without one they stay as zombies.
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      ENV: prod
    volumes:
      - ./data:/data
      - openmeteo-data:/openmeteo:ro # see api
    healthcheck:
      test: ["CMD", "snowwatch", "healthcheck", "worker"]
      interval: 60s
      timeout: 15s
      start_period: 60s
      retries: 3
    # Forecast runs and the map's jobs can overlap. Peaks measured 17 Nov 2026: radar
    # ~470 MB, wide radar ~320, forecast ~570, layers ~550, totals ~400.
    mem_limit: 2560m
    restart: unless-stopped

  # A self-hosted Open-Meteo server for forecasts and elevation, and the ensembles the
  # service below downloads (otherwise ensembles use the public API). Opt-in: it starts
  # only with COMPOSE_PROFILES=openmeteo in .env, and the app uses it only with
  # OPEN_METEO_URL=http://openmeteo:8080. It needs a CPU with AVX2 (x86) or ARM64; without, it crash-loops with "Illegal instruction". It reads the
  # public Open-Meteo data on AWS as asked and caches it in the volume (CACHE_SIZE is
  # reserved on disk at once). See docs/DEPLOYMENT.md, "Self-hosted forecasts".
  openmeteo:
    <<: *hardening
    profiles: [openmeteo]
    # Pinned: bumping it is a deliberate PR (docs/DEPLOYMENT.md). AGPL-3.0, run unmodified.
    image: ghcr.io/open-meteo/open-meteo@sha256:bf94e8b39761b59a91bd04bb926b3834cad00eaf71f1aa64b2fd17fbe987846a
    environment:
      REMOTE_DATA_DIRECTORY: https://openmeteo.s3.amazonaws.com/data/
      # Reserved on disk in full as soon as the server starts: keep this much free, plus
      # room to spare. ~27 MB per location was measured, so 10 GB is plenty for 50.
      CACHE_SIZE: ${OPEN_METEO_CACHE_SIZE:-10GB}
    volumes:
      # A named volume: the image runs as a non-root user, and a root-owned bind mount
      # fails with "cannotCreateFile ... cache.bin, errno 13".
      - openmeteo-data:/app/data
    # No published port: only api and worker reach it, on the compose network.
    healthcheck:
      # Any HTTP answer (the root is a 404) means the server is up.
      test: ["CMD", "curl", "-so", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    mem_limit: 1g
    restart: unless-stopped

  # Downloads every new GEFS, ECMWF ENS and GEPS run (snowfall only) into the server's
  # volume, which the server then serves at /v1/ensemble (docs/OPEN-METEO-PLAN.md,
  # milestone 1b). Opt-in: add `ensembles` to COMPOSE_PROFILES next to `openmeteo`. Uses
  # ~1.5-2 GB of disk, kept bounded (docker/ensembles.sh), and ~15 GB of downloads a day. See
  # docs/DEPLOYMENT.md, "Self-hosted ensembles".
  openmeteo-ensembles:
    <<: *hardening
    profiles: [ensembles]
    # The same pinned image as openmeteo: bump both together.
    image: ghcr.io/open-meteo/open-meteo@sha256:bf94e8b39761b59a91bd04bb926b3834cad00eaf71f1aa64b2fd17fbe987846a
    entrypoint: ["sh", "/ensembles.sh"]
    environment:
      # No "previous day" copies of the time-chunk files: nothing reads them here.
      GENERATE_PREVIOUS_DAY: "false"
      ENSEMBLES_MIN_FREE_GB: ${ENSEMBLES_MIN_FREE_GB:-5}
    volumes:
      - openmeteo-data:/app/data
      - ./docker/ensembles.sh:/ensembles.sh:ro
    # Half the mini PC, so forecast runs and the map's jobs keep their share. The largest
    # download (GEFS 0.25°) peaked at 722 MiB with 2 CPUs (27 Nov 2026): room to spare.
    cpus: 2
    mem_limit: 1536m
    # The script writes one line per download; keep docker's log of it small anyway.
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    restart: unless-stopped

volumes:
  openmeteo-data:
