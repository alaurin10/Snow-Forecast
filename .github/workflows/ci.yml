name: CI

# Tests only. Nothing is built or deployed here: the mini PC builds and
# deploys itself (docs/PLAN.md section 6).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy snowwatch
      - run: uv run pytest
      - name: API schema is up to date
        run: |
          uv run snowwatch schema --out ../frontend/src/lib/api-schema.json
          git diff --exit-code ../frontend/src/lib/api-schema.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11; npm 10 has a peer-dependency bug with this tree.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated types match the API schema
        run: |
          npm run types
          git diff --exit-code src/lib/types.gen.ts
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build

  docker:
    # Proves the image builds and starts. Nothing is pushed anywhere: the
    # mini PC builds its own image.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t snowwatch:ci .
      - name: Smoke test
        run: |
          docker run --rm snowwatch:ci snowwatch --help
          mkdir -p /tmp/sw-data && chmod 777 /tmp/sw-data
          docker run -d --name sw -p 8000:8000 -v /tmp/sw-data:/data snowwatch:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/api/livez && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/api/health)" = 503
          curl -sf localhost:8000/ | grep -q '<html'
          curl -sf localhost:8000/calendar | grep -q '<html'
          docker run --rm -v /tmp/sw-data:/data snowwatch:ci snowwatch init
          curl -sf localhost:8000/api/locations | grep -q crystal
          curl -sf localhost:8000/manifest.webmanifest | grep -q 'Snow Watch'
          docker logs sw
