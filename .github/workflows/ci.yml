name: CI

# Checks only. Nothing is deployed from here: each server builds its own image
# (see docs/DEPLOYMENT.md). Actions are pinned to commits; Dependabot keeps them fresh.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy snowwatch
      - run: uv run pytest --cov
      - name: API schema is up to date
        run: |
          uv run snowwatch schema --out ../frontend/src/lib/api-schema.json
          git diff --exit-code ../frontend/src/lib/api-schema.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24 ships npm 11; npm 10 has a peer-dependency bug with this tree.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated types match the API schema
        run: |
          npm run types
          git diff --exit-code src/lib/types.gen.ts
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build

  e2e:
    # The built app in a real browser against the API, with forecasts rebuilt from
    # the saved fixtures (no network calls to weather services).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend

  audit:
    # Known vulnerabilities in dependencies. Reported, not blocking: a new advisory
    # shouldn't turn every open PR red; Dependabot opens the fix.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Python dependencies
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project --format requirements-txt > /tmp/req.txt
          uvx pip-audit -r /tmp/req.txt
      - name: npm dependencies
        working-directory: frontend
        run: npm audit --omit=dev

  docker:
    # Proves the image builds and starts. Nothing is pushed anywhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f docker/Dockerfile --build-arg GIT_COMMIT=${{ github.sha }} -t snowwatch:ci .
      - name: Smoke test
        run: |
          docker run --rm snowwatch:ci snowwatch --help
          mkdir -p /tmp/sw-data && chmod 777 /tmp/sw-data
          docker run -d --name sw -p 8000:8000 -v /tmp/sw-data:/data \
            -e OWNER_PASSWORD=ci-owner-password-123 snowwatch:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/api/livez && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/api/health)" = 503
          curl -sf localhost:8000/ | grep -q '<html'
          curl -sf localhost:8000/calendar | grep -q '<html'
          curl -sfI localhost:8000/ | grep -qi 'content-security-policy'
          docker run --rm -v /tmp/sw-data:/data snowwatch:ci snowwatch init
          curl -sf localhost:8000/api/locations | grep -q crystal
          curl -sf localhost:8000/api/meta | grep -q '"commit":"${{ github.sha }}"'
          curl -sf localhost:8000/manifest.webmanifest | grep -q 'Snow Watch'
          # Owner sign-in round trip (Origin as a browser sends it).
          curl -sf -c /tmp/jar -H 'Origin: http://localhost:8000' -H 'Content-Type: application/json' \
            -d '{"password":"ci-owner-password-123"}' localhost:8000/api/auth/login | grep -q '"is_owner":true'
          curl -sf -b /tmp/jar localhost:8000/api/admin/locations | grep -q crystal
          docker logs sw
