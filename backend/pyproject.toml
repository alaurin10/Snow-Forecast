[project]
name = "snowwatch"
version = "1.0.0"
description = "Snow Watch: self-hosted snow forecast pipeline and API"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10,<4",
    "fastapi>=0.115",
    "gribberish>=1.9.0",
    "httpx>=0.27",
    "numpy>=2.0,<2.4", # 2.4+ needs an x86-64-v2 CPU; VMs often show a plainer one
    "pillow>=13.0.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pywebpush>=2.5.0",
    "pyyaml>=6.0",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
snowwatch = "snowwatch.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "pywebpush.*", "py_vapid.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["snowwatch"]
branch = false

[tool.coverage.report]
fail_under = 88
skip_covered = true
show_missing = true
